{% assign lang_names = "en:English|fr:Français|ko:한국어" | split: "|" %}

<div class="lang-switcher">
  <select id="lang-select" onchange="if(this.value) window.location.href=this.value;">
    {% for lang in site.languages %}
      {% assign lang_label = lang %}
      {% for pair in lang_names %}
        {% assign parts = pair | split: ":" %}
        {% if parts[0] == lang %}
          {% assign lang_label = parts[1] %}
        {% endif %}
      {% endfor %}

      {% assign base_url = page.url %}
      {% assign ext = "" %}
      {% assign filename = base_url %}
      {% if base_url contains "." %}
        {% assign url_parts = base_url | split: "." %}
        {% assign ext = "." | append: url_parts[-1] %}
        {% assign filename = base_url | remove: ext %}
      {% endif %}

      {% if site.active_lang != site.default_lang %}
        {% assign current_suffix = "_" | append: site.active_lang %}
        {% assign suffix_len = current_suffix | size %}
        {% assign filename_len = filename | size %}
        {% assign check_start = filename_len | minus: suffix_len %}
        {% assign filename_tail = filename | slice: check_start, suffix_len %}
        {% if filename_tail == current_suffix %}
          {% assign filename = filename | slice: 0, check_start %}
        {% endif %}
      {% endif %}

      {% if lang == site.default_lang %}
        {% assign target_url = filename | append: ext %}
      {% else %}
        {% assign target_url = filename | append: "_" | append: lang | append: ext %}
      {% endif %}

      <option value="{{ target_url | relative_url }}" {% if lang == site.active_lang %}selected{% endif %}>
        {{ lang_label }}
      </option>
    {% endfor %}
  </select>
</div>

{% if page.rendered_lang != site.active_lang %}
<div class="translation-notice" style="font-size: 0.85em; opacity: 0.75; margin-top: 4px;">
  This page does not have a {{ site.active_lang}} version yet; here is the {{ page.rendered_lang }} version.
</div>
{% endif %}
